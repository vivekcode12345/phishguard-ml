<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>PhishGuard Local</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; padding: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .status { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
    .bar { position: relative; height: 8px; border-radius: 4px; background: var(--line); margin: 10px 0 4px; }
    .bar > .fill { height: 100%; border-radius: 4px; background: var(--ok); }
    .bar > .fill.bad { background: var(--bad); }
    .bar > .thr { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--fg); }
    .row { display: flex; gap: 6px; } .row input { flex: 1; }
    footer { display: flex; justify-content: space-between; align-items: center; }
    label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .url { font-size: 12px; max-height: 3.6em; overflow: hidden; }
  </style>
</head>
<body>
  <header>
    <h1>PhishGuard Local</h1>
    <span class="muted">runs on this device</span>
  </header>
  <div class="card" id="verdict">
    <div class="status" id="status">Checking…</div>
    <div class="url mono muted" id="url"></div>
    <div class="bar" id="bar" hidden><div class="fill" id="fill"></div><div class="thr" id="thr"></div></div>
    <div class="muted" id="detail"></div>
  </div>
  <div class="card">
    <div class="muted" style="margin-bottom:6px">Check a URL (analysed locally)</div>
    <div class="row"><input type="text" id="manual" placeholder="https://example.com/login"><button class="primary" id="go">Check</button></div>
  </div>
  <footer>
    <label><input type="checkbox" id="enabled"> Protection on</label>
    <span class="muted" id="stats"></span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
